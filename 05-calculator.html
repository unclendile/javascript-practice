<!DOCTYPE html>
<html>
  <head>
    <title>Simple Calculator</title>
    <style>
      body{
        background-color: black;
        color: white;
      }
      button {
        width: 50px;
        height: 50px;
        font-size: 20px;
        margin: 5px;
        border-radius: 25px;
        border: none;
        background-color: rgb(50, 50, 50);
        color: white;
      }
      .js-ans{
        width: 25%;
        font-size: 45px;
        margin: 5px;
        padding: 1px;
        font-size: 20px;
        font-weight: bold;
      }
      .operator{
        background-color: orange;
      }
      </style>
  </head>
  <body>
    <p class="js-ans"></p>
    <p>
    <button onclick="updateCalculation('1');">1</button>
    <button onclick="updateCalculation('2');">2</button>
    <button onclick="updateCalculation('3');">3</button>
    <button class="operator" onclick="updateCalculation(' + ');">+</button>
  </p>
  <p>
    <button onclick="updateCalculation('4');">4</button>    
    <button onclick="updateCalculation('5');">5</button>  
    <button onclick="updateCalculation('6');">6</button>
    <button class="operator" onclick="updateCalculation(' - ');">-</button>
    </p>
    <p>
    <button  onclick="updateCalculation('7');">7</button>
    <button onclick="updateCalculation('8');">8</button>
    <button onclick="updateCalculation('9');">9</button>
    <button class="operator" onclick="updateCalculation(' * ');">*</button>
    </p>
    <p>
    <button onclick="updateCalculation('0');">0</button>
    <button onclick="updateCalculation('.');">.</button>
    <button onclick="calculation = eval(calculation); console.log(calculation);ansElem.innerHTML = calculation;
    saveCalculation();
   ">=</button>
   <button class="operator" onclick="updateCalculation(' / ');">/</button>
    </p>
    <p>
    <button onclick="calculation = '';
    console.log(calculation);
      ansElem.innerHTML = calculation || 0;
    saveCalculation();
    ">C</button>
    </p>
    <div id="result"><a href="">Click here</a> for final version of the project</div>

    <script>
      const ansElem = document.querySelector('.js-ans');
      let calculation = localStorage.getItem('calculation') || '';
        
      function updateCalculation(item){
        calculation +=item;
        console.log(calculation);
        ansElem.innerHTML = calculation;
        saveCalculation();
        
      }

      function saveCalculation(){
        localStorage.setItem('calculation',(calculation));
      }
    </script>
  </body>  
</html>
