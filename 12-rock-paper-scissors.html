<!DOCTYPE html>
<html>
  <head>
    <title>Rock, Paper, Scissors</title>
    <link href="styles/12-rock-paper-scissors.css" rel="stylesheet"/>
  </head>
  <body>
    <h1 class="title">Rock, Paper, Scissors</h1>
    
    <button class="move-btn js-rock-btn">
      <img src="\images\rock-emoji.png" class="move-icon" alt=""/>
    </button>

    <button class="move-btn js-paper-btn"
      onclick="
       playGame('paper');"
    >

      <img src="\images\paper-emoji.png" class="move-icon" alt=""/>
    </button>

    <button class="move-btn js-scissors-btn"
      onclick="
      playGame('scissors');"
    >
      <img src="\images\scissors-emoji.png" class="move-icon" alt=""/>
    </button>

    <p class="js-results results"></p>
    <p class="js-moves moves"></p>
    <p class="js-score score"></p>
      <p class="js-confirm"></p>

    <button class="reset-btn js-reset-btn">Reset Score</button>
    <button class="auto-btn js-stop-auto-play-btn">Auto Play</button>



    <script src="scripts\12-rock-paper-scissors.js">
      
    </script>
  </body>  
</html>
