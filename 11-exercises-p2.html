      //11w
      function findIndex(array,word){
        let index = -1;
        for (let i = 0; i < array.length; i++) {
          const element = array[i];
          if(element === word){
            index = i;
            break;
          }          
        }
        return index;
      }
      console.log(findIndex(['good','search','ping','hello','search'],'search'));

      function unique(array){
        const result = [];
        let repeat = '';
        for (let i = 0; i < array.length; i++) {
          const element = array[i];

          if(findIndex(result,element) === -1){
            result.push(element);
          }
          //result.push(element);
        }
        return result;
      }
