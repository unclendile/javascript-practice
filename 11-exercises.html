        const output = document.querySelector('.js-output');

        for(let i = 0; i < array.length; i++){
          const item = array[i];
          value = item;
          
        }
        
        if(event.key === 'Enter'){
          if(name === value){
            output.innerHTML = `${name} already exist`;
          }
          else{
            array.push(value);
          }
          
          (output.innerHTML = array);
        }
        return output.innerHTML = array;
