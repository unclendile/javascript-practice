<!DOCTYPE html>
<html>
  <head>
    <title>DOM Exercises</title>
  </head>
  <body>
    <button>9a</button>
    <button class="js-btn-9b">9b</button>
    <button class="js-heads-btn" onclick="playGame('heads')">heads</button>
    <button class="js-tails-btn" onclick="playGame('tails')">tails</button>
    <div id="js-output"></div>

    <input class="js-name-input" onkeydown="clickEnterGetName(event)">
    <button onclick="getName()">Submit</button>
    <p id="js-get-name"></p>

    <input class="js-message" placeholder="Type something" onkeyup="typeSomething();">
    <p class="js-on-key-up"></p>


    <script>
      console.log(document.querySelector('button'));
      document.querySelector('.js-btn-9b').innerHTML = '9b done!';

      function typeSomething(){
        const inputValue = document.querySelector('.js-message');
        
           document.querySelector('.js-on-key-up').innerHTML = inputValue.value;
      }
      
      

      
      function getName(){
        const nameInputElem = document.querySelector('.js-name-input');
        const dislayElem = document.querySelector('#js-get-name');

        dislayElem.innerHTML = `Your name is: ${nameInputElem.value}`;
      }

      function clickEnterGetName(event){
        if(event.key === 'Enter'){
          getName();
        }
      }


      function playGame(select){
        
        let headsBtnElem = document.querySelector('.js-heads-btn').innerHTML;
        let tailsBtnElem = document.querySelector('.js-tails-btn').innerHTML;

        let paraElem = document.querySelector('#js-output');
        if(headsBtnElem === 'heads'){
          paraElem.innerText = `You chose: ${select}`;
        }
        if(tailsBtnElem === 'tails'){
          paraElem.innerText = `You chose: ${select}`;
        }
        
      }

      


      
    </script>
  </body>  
</html>
