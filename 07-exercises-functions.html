<!DOCTYPE html>
<html>
  <head>
    <title>Functions Exercises</title>
  </head>
  <body>


    <script>
      function greet(name){
        if(!name){
          return "Hi there!";
        } else {
          return `Hello, ${name}!`;
        }
      }

      console.log(greet());
      console.log(greet("Andile"));

      function convertToFahrenheit(celsius){
        return (celsius * 9/5) + 32;
      }

      console.log(convertToFahrenheit(25));

      function convertToCelsius(fahrenheit){
        return (fahrenheit - 32) * 5/9;
      }

      console.log(convertToCelsius(86));

      function convertToTemperature(degrees, unit){
        if(unit === "F"){
          return convertToFahrenheit(degrees);
        } else if(unit === "C"){
          return convertToCelsius(degrees);
        } else {
          return "Invalid unit. Please use 'C' for Celsius or 'F' for Fahrenheit.";
        }

      }
      console.log(convertToTemperature(25, "C"));
      console.log(convertToTemperature(86, "F"));
      console.log(convertToTemperature(25, "K"));

      function convertLength(length, from, to){
      
        
        if(from === 'km' && to === 'miles'){
          return (length / 1.6) + " miles";
        }
        else if(from === 'miles' && to === 'km'){
          return (length * 1.6) + " km";
        } else if(from === to){
          return (length) + " " + to;
        }else if(from === 'ft' && to === 'miles'){
          return (length / 5280) + ' miles';
        }else if(from === 'miles' && to === 'ft'){
          return (length * 5280) + ' ft';
        }else if(from === 'ft' && to === 'km'){
          return (length / 3280.84) + ' km';  
        }else if(from === 'km' && to === 'ft'){
          return (length * 3280.84) + ' ft';  
        }
      }

      console.log(convertLength(50, 'miles', 'km'));
      console.log(convertLength(32, 'km', 'miles'));
      console.log(convertLength(50, 'km', 'km'));
      console.log(convertLength(5280, 'ft', 'miles'));
      console.log(convertLength(5, 'miles', 'ft'));
      console.log(convertLength(5, 'km', 'ft'));


      
    </script>
  </body>  
</html>
