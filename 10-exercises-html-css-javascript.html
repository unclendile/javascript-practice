<!DOCTYPE html>
<html>
  <head>
    <title>Execises</title>
    <link href="styles/10-exercises-html-css-javascript.css" rel="stylesheet"/>
  </head>
  <body>
    <h1>Execises</h1>
    <div>
      //10a. Amazon button
      <div class="amazon-div-btn">
        <button class="cart-btn">Add to Cart</button>
      </div>
    </div>
    

    <div>
      //10b. Uber buttons
      <div class="uber-div-btn">
        <button class="request-btn">Request now</button>
        <button class="schedule-btn">Schedule for later</button>
      </div>
    </div>
    
       
      <div>
        //10c. Testing if the button has an class attribute using classList.contains()<br>
        <button class="js-button testing" onclick="hasClassAtt();">Test</button>
        <p></p>
      </div>

      <div>
        //10d. when button on click it should turn ON / OFF<br>
        <div class="div-gaming-btn">
          <button class="gaming-btn js-gaming-btn" onclick="turnButtonColor()">Gaming</button>
        </div>
      </div>

      

      <div>
        10e. 3 buttons that can be turned ON / OFF<br>
        <div class="div-three-btn">
          <button class="three-btn js-btn-game" onclick="changeButtonColor('.js-btn-game');">Gaming</button>
          <button class="three-btn js-btn-music" onclick="changeButtonColor('.js-btn-music')">Music</button>
          <button class="three-btn js-btn-tech" onclick="changeButtonColor('.js-btn-tech')">Tech</button>
        </div>
      </div>

   
   
    
    


    <script src="scripts/10-exercises-html-css-javascript.js">
      
    </script>
  </body>  
</html>
