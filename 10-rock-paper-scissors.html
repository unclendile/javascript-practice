<!DOCTYPE html>
<html>
  <head>
    <title>Rock, Paper, Scissors</title>
    <link href="styles/10-rock-paper-scissors.css" rel="stylesheet"/>
  </head>
  <body>
    <h1 class="title">Rock, Paper, Scissors</h1>
    
    <button class="move-btn"
       onclick="playGame('rock');
       ">
      <img src="\images\rock-emoji.png" class="move-icon" alt=""/>
    </button>

    <button class="move-btn"
      onclick="
       playGame('paper');"
    >

      <img src="\images\paper-emoji.png" class="move-icon" alt=""/>
    </button>

    <button class="move-btn"
      onclick="
      playGame('scissors');"
    >
      <img src="\images\scissors-emoji.png" class="move-icon" alt=""/>
    </button>

    <p class="js-results results"></p>
    <p class="js-moves moves"></p>
    <p class="js-score score"></p>


    <button class="reset-btn"
      onclick="
      score.wins = 0;
      score.losses = 0;
      score.ties = 0;
      localStorage.removeItem('score');updateScore();
      ;">Reset</button><button class="auto-btn">Auto</button>


    <script src="scripts\10-rock-paper-scissors.js">
      
    </script>
  </body>  
</html>
